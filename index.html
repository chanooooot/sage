<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirDoodle</title>
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirDoodle">
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #F97316;
    --color-primary-dark: #C2410C;
    --color-accent: #7C3AED;
    --color-accent-dark: #5B21B6;
    --color-danger: #EF4444;
    --color-danger-dark: #B91C1C;
    --color-ink: #1F2937;
    font-family: system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  body.mirrored video, body.mirrored canvas {
    transform: scaleX(-1); /* mirror, front camera only */
  }

  button {
    font-family: 'Fredoka', system-ui, sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 120ms ease-out, box-shadow 120ms ease-out, opacity 120ms ease-out;
  }
  button:active {
    transform: scale(0.93);
    box-shadow: 0 1px 0 rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.25) !important;
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }

  #flipBtn, #camBtn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    z-index: 10;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(155deg, #fff, #f0f0f0);
    box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 3px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #flipBtn { right: 10px; }
  #camBtn { right: 62px; }
  #camBtn.off { background: linear-gradient(155deg, #F87171, var(--color-danger-dark)); }
  #flipBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #camOffScreen {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: linear-gradient(165deg, #3B2A5C, #5B215B);
  }
  #camOffScreen.show { display: flex; }
  #camOffScreen .box {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #A78BFA, var(--color-accent));
    box-shadow: 0 4px 0 var(--color-accent-dark), 0 6px 14px rgba(0,0,0,0.35);
  }
  #camOffScreen p { margin: 0; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.8); }
  #fps {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    z-index: 10;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #retry {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    color: #fff;
    text-align: center;
    padding: 32px;
    background: linear-gradient(165deg, rgba(91,33,182,0.90), rgba(190,24,93,0.78));
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #retry .box {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #F87171, #DC2626);
    box-shadow: 0 4px 0 #7f1414, 0 6px 14px rgba(0,0,0,0.35);
  }
  #retry p { margin: 0; font-size: 15px; font-family: system-ui, sans-serif; line-height: 1.6; max-width: 300px; color: rgba(255,255,255,0.8); }
  #retry button, #startCameraBtn {
    padding: 16px 38px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 20px;
    border: none;
    background: linear-gradient(155deg, #FF9A4D, var(--color-primary));
    color: #fff;
    box-shadow: 0 5px 0 var(--color-primary-dark), 0 8px 18px rgba(0,0,0,0.35);
  }
  #bottomBar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  #bottomBar button {
    min-height: 52px;
    padding: 8px 6px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-radius: 22px;
    border: none;
    background: linear-gradient(155deg, #fff, #f5f5f5);
    color: var(--color-ink);
    box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 3px 8px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  #bottomBar button .icon {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #aliveBtn {
    background: linear-gradient(155deg, #A78BFA, var(--color-accent));
    color: #fff;
    box-shadow: 0 4px 0 var(--color-accent-dark), 0 3px 8px rgba(0,0,0,0.3);
  }
  #colorSwatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.7);
  }
  #recordBtn.recording {
    background: linear-gradient(155deg, #F87171, #DC2626);
    color: #fff;
    box-shadow: 0 4px 0 #7f1414, 0 0 16px 4px rgba(239,68,68,0.55);
    animation: recPulse 1.4s ease-in-out infinite;
  }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 4px 0 #7f1414, 0 0 0 0 rgba(239,68,68,0.55); }
    50% { box-shadow: 0 4px 0 #7f1414, 0 0 16px 6px rgba(239,68,68,0.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    #recordBtn.recording { animation: none; }
  }
  /* recording feedback: dim non-record controls + pulsing frame border, CSS-only */
  #bottomBar:has(#recordBtn.recording) button:not(#recordBtn),
  body:has(#recordBtn.recording) #flipBtn,
  body:has(#recordBtn.recording) #camBtn {
    opacity: 0.55;
  }
  body:has(#recordBtn.recording)::after {
    content: '';
    position: fixed;
    inset: 8px;
    border-radius: 44px;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.6), 0 0 22px 4px rgba(239,68,68,0.4);
    pointer-events: none;
    z-index: 9;
  }
  #recTimer {
    position: fixed;
    top: max(58px, calc(env(safe-area-inset-top) + 48px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(239,68,68,0.92);
    color: #fff;
    font-family: 'Fredoka', system-ui, sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  #recTimer.show { display: flex; }
  #recTimer .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  #idleHint {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    z-index: 9;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 16px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
  }
  #idleHint.show {
    display: flex;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #idleHint.show { animation: none; opacity: 0.9; }
  }
  #firstRun {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    color: #fff;
    text-align: center;
    padding: 28px;
    background: linear-gradient(165deg, rgba(91,33,182,0.90), rgba(190,24,93,0.78));
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #firstRun .icons { display: flex; gap: 18px; }
  #firstRun .iconChip { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #firstRun .iconChip .box {
    width: 56px;
    height: 56px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #firstRun .iconChip span { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); }
  #firstRun .iconChip:nth-child(1) .box { background: linear-gradient(155deg, #60A5FA, #2563EB); box-shadow: 0 4px 0 #1E40AF, 0 6px 14px rgba(0,0,0,0.35); }
  #firstRun .iconChip:nth-child(1) .box img { width: 28px; height: 28px; object-fit: contain; }
  #firstRun .iconChip:nth-child(2) .box { background: linear-gradient(155deg, #A78BFA, #7C3AED); box-shadow: 0 4px 0 #5B21B6, 0 6px 14px rgba(0,0,0,0.35); }
  #firstRun .iconChip:nth-child(3) .box { background: linear-gradient(155deg, #F9A8D4, #EC4899); box-shadow: 0 4px 0 #BE185D, 0 6px 14px rgba(0,0,0,0.35); }
  #firstRun h1 { margin: 0; font-size: 24px; font-weight: 700; }
  #firstRun p {
    margin: 0;
    font-size: 15px;
    font-family: system-ui, sans-serif;
    line-height: 1.6;
    max-width: 300px;
    color: rgba(255,255,255,0.8);
    text-wrap: pretty;
  }
</style>
</head>
