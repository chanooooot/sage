<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirToon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror */
  }
  #fps {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    z-index: 10;
  }
  #retry {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  #retry button {
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #4ade80;
  }
  #aliveBtn, #recordBtn, #clearBtn {
    position: fixed;
    bottom: 24px;
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.85);
    z-index: 10;
  }
  #aliveBtn { left: calc(50% - 145px); }
  #recordBtn { left: calc(50% - 45px); }
  #recordBtn.recording { background: #ff5252; color: #fff; }
  #clearBtn { left: calc(50% + 65px); }
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="fps"></div>
  <button id="aliveBtn">✨ Alive</button>
  <button id="recordBtn">⏺ Record</button>
  <button id="clearBtn">🗑 Clear</button>
  <div id="retry">
    <p>Camera access denied or unavailable.<br>AirToon needs your front camera to work.</p>
    <button id="retryBtn">Try Again</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
