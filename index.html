<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirToon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  body.mirrored video, body.mirrored canvas {
    transform: scaleX(-1); /* mirror, front camera only */
  }
  #flipBtn {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 10;
    padding: 8px 12px;
    font-size: 20px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.85);
  }
  #fps {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    z-index: 10;
  }
  #retry {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  #retry button {
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #4ade80;
  }
  #bottomBar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  #bottomBar button {
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.85);
  }
  #recordBtn.recording { background: #ff5252; color: #fff; }
  #firstRun {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: #fff;
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 24px;
    background: rgba(0,0,0,0.55);
  }
  #firstRun .icons { font-size: 40px; letter-spacing: 24px; }
  #firstRun p { font-size: 18px; line-height: 1.6; max-width: 320px; }
</style>
</head>
<body class="mirrored">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="fps"></div>
  <button id="flipBtn">🔄</button>
  <div id="bottomBar">
    <button id="aliveBtn">✨ Alive</button>
    <button id="recordBtn">⏺ Record</button>
    <button id="clearBtn">🗑 Clear</button>
  </div>
  <div id="firstRun">
    <div class="icons">📱🤏✊👋</div>
    <p>Prop your phone up.<br>Pinch (thumb + finger) to draw.<br>Make a fist to bring it to life.<br>Bat or poke it with your hand!</p>
    <p style="font-size:14px;opacity:0.8;">(tap to start camera)</p>
  </div>
  <div id="retry">
    <p>Camera access denied or unavailable.<br>AirToon needs your front camera to see your hand — please allow it and try again.</p>
    <button id="retryBtn">Try Again</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
