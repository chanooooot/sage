<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirDoodle</title>
<link rel="icon" id="favicon" href="">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AirDoodle">
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #F97316;
    --color-primary-dark: #C2410C;
    --color-accent: #7C3AED;
    --color-accent-dark: #5B21B6;
    --color-danger: #EF4444;
    --color-danger-dark: #B91C1C;
    --color-ink: #1F2937;
    font-family: 'Nunito', system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video, canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  body.mirrored video, body.mirrored canvas {
    transform: scaleX(-1); /* mirror, front camera only */
  }

  button {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 120ms ease-out, box-shadow 120ms ease-out;
  }
  button:active {
    transform: scale(0.93);
    box-shadow: 0 1px 0 rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.25) !important;
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }

  #flipBtn, #camBtn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    z-index: 10;
    width: 44px;
    height: 44px;
    font-size: 20px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: var(--color-ink);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.25);
  }
  #flipBtn { right: 10px; }
  #camBtn { right: 62px; font-size: 18px; }
  #camBtn.off { background: var(--color-danger); color: #fff; }
  #fps {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #0f0;
    font-family: monospace;
    font-size: 14px;
    z-index: 10;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #retry {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: #fff;
    text-align: center;
    padding: 32px;
    background: rgba(15,15,20,0.9);
  }
  #retry p { font-size: 17px; line-height: 1.6; max-width: 320px; }
  #retry button {
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 16px;
    border: none;
    background: var(--color-primary);
    color: #fff;
    box-shadow: 0 4px 0 var(--color-primary-dark), 0 4px 12px rgba(0,0,0,0.3);
  }
  #bottomBar {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 6px;
    padding: 14px 10px calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
    overflow-x: auto;
  }
  #bottomBar button {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    border-radius: 22px;
    border: none;
    background: #fff;
    color: var(--color-ink);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.25);
  }
  #aliveBtn {
    background: var(--color-accent);
    color: #fff;
    box-shadow: 0 3px 0 var(--color-accent-dark), 0 2px 6px rgba(0,0,0,0.3);
  }
  #colorSwatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.6);
    vertical-align: middle;
    margin-right: 2px;
  }
  #recordBtn.recording {
    background: var(--color-danger);
    color: #fff;
    box-shadow: 0 3px 0 var(--color-danger-dark), 0 2px 6px rgba(0,0,0,0.3);
    animation: recPulse 1s ease-in-out infinite;
  }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 3px 0 var(--color-danger-dark), 0 2px 6px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 3px 0 var(--color-danger-dark), 0 2px 16px 4px rgba(239,68,68,0.6); }
  }
  @media (prefers-reduced-motion: reduce) {
    #recordBtn.recording { animation: none; }
  }
  #idleHint {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    z-index: 9;
    display: none;
    padding: 8px 16px;
    border-radius: 16px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
  }
  #idleHint.show {
    display: block;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #idleHint.show { animation: none; opacity: 0.9; }
  }
  #firstRun {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: #fff;
    text-align: center;
    padding: 32px;
    background: rgba(15,15,20,0.82);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #firstRun .icons { font-size: 44px; letter-spacing: 20px; }
  #firstRun p {
    font-size: 18px;
    line-height: 1.7;
    max-width: 320px;
    text-wrap: pretty;
  }
  #firstRun .hint { font-size: 14px; opacity: 0.75; font-weight: 400; }
</style>
</head>
<body class="mirrored">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="fps"></div>
  <button id="camBtn" aria-label="Turn camera on or off">📷</button>
  <button id="flipBtn" aria-label="Flip front/back camera">🔄</button>
  <div id="bottomBar">
    <button id="aliveBtn"><span id="colorSwatch"></span> Alive</button>
    <button id="recordBtn">⏺ Record</button>
    <button id="undoBtn">↩️ Undo</button>
    <button id="clearBtn">🗑 Clear</button>
  </div>
  <div id="idleHint">Pinch to draw ✏️</div>
  <div id="firstRun">
    <div class="icons">📱🤏✊👋</div>
    <p>Prop your phone up.<br>Pinch (thumb + finger) to draw.<br>Make a fist to bring it to life.<br>Bat or poke it with your hand!</p>
    <p class="hint">(tap to start camera)</p>
  </div>
  <div id="retry">
    <p>Camera access denied or unavailable.<br>AirDoodle needs your front camera to see your hand — please allow it and try again.</p>
    <button id="retryBtn">Try Again</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="app.js?v=27"></script>
</body>
</html>
